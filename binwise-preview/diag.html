<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><title>Binwise diagnostics</title></head>
<body>
<pre id="log">start</pre>
<script type="module">
const log = (m) => { document.getElementById('log').textContent += "\n" + m; };
window.__diag = [];
const push = (m) => { window.__diag.push(m); log(m); };

push("ua=" + navigator.userAgent);
push("gpu=" + ('gpu' in navigator) + " crossOriginIsolated=" + self.crossOriginIsolated);
try {
  const adapter = navigator.gpu ? await navigator.gpu.requestAdapter() : null;
  push("adapter=" + (adapter ? "ok" : "null"));
} catch (e) { push("adapter error=" + e.message); }

// Is the HF file reachable from the page?
for (const u of [
  "https://huggingface.co/Xenova/clip-vit-base-patch32/resolve/main/config.json",
  "https://huggingface.co/Xenova/clip-vit-base-patch32/resolve/main/onnx/vision_model_quantized.onnx",
  "https://huggingface.co/Xenova/clip-vit-base-patch32/resolve/main/onnx/vision_model_q8.onnx",
]) {
  try {
    const r = await fetch(u, { method: "GET", headers: { Range: "bytes=0-99" } });
    push("fetch " + u.split('/').slice(-1)[0] + " -> " + r.status);
  } catch (e) { push("fetch " + u.split('/').slice(-1)[0] + " -> ERR " + e.message); }
}

let mod;
try {
  mod = await import("https://cdn.jsdelivr.net/npm/@huggingface/transformers@4.3.2/dist/transformers.min.js");
  push("transformers import ok, version=" + (mod.env?.version ?? "?"));
  mod.env.allowLocalModels = false;
  push("backends=" + JSON.stringify(Object.keys(mod.env.backends ?? {})));
} catch (e) { push("transformers import FAILED " + e.message); }

const tries = [
  ["Xenova/clip-vit-base-patch32", { dtype: "q8", device: "wasm" }],
  ["Xenova/clip-vit-base-patch32", { dtype: "fp32", device: "wasm" }],
  ["onnx-community/clip-vit-base-patch32-ONNX", { dtype: "q8", device: "wasm" }],
];

for (const [id, opts] of tries) {
  const t0 = performance.now();
  try {
    const p = await mod.pipeline("zero-shot-image-classification", id, opts);
    push("OK " + id + " " + JSON.stringify(opts) + " in " + Math.round(performance.now() - t0) + "ms");
    window.__pipe = p;
    break;
  } catch (e) {
    push("FAIL " + id + " " + JSON.stringify(opts) + " -> " + (e && e.message ? e.message : String(e)).slice(0, 300));
  }
}
push("done");
</script>
</body>
</html>
